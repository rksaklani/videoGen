# VideoGen API Configuration
# All settings in one place — no more magic numbers

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

model:
  base_path: "./Backend/weights/ckpts"
  checkpoint: "hunyuan-video-t2v-720p/transformers/mp_rank_00_model_states_fp8.pt"
  vae: "884-16c-hy0801"
  text_encoder: "llava-llama-3-8b"
  text_encoder_2: "clipL"
  whisper: "whisper-tiny"
  face_detector: "det_align/detface.pt"
  precision: "fp16"
  use_fp8: true

# RTX 4090 24GB: keep cpu_offload true — LLaVA 8B + VAE + DiT exceed VRAM if fully GPU-resident.
# (cpu_offload: false only works on cards with enough headroom or smaller text encoder paths.)
inference:
  default_steps: 45
  default_cfg_scale: 7.5
  default_seed: 42
  # 512 is safest on 24GB with LLaVA + DiT; raise toward 704 only if mem_get_info shows plenty of free VRAM.
  default_image_size: 512
  max_image_size: 768
  default_fps: 25
  max_frames: 9999          # No artificial limit — audio duration = video duration
  max_vae_frames: 385       # Per-pass frame ceiling (4n+1); raise with more VRAM / lower resolution
  max_duration_seconds: 300  # 5 minutes max
  chunk_duration_seconds: 8  # Fewer chunks / seams than 5s; reduce if OOM
  use_deepcache: true
  cpu_offload: true
  use_dynamic_steps: false   # true = vary steps by duration (faster, lower quality on long clips)
  dynamic_steps_floor: 32      # When use_dynamic_steps is true, never go below this
  video_encode_crf: 20        # Lower = better quality (libx264); 23 was default in code
  video_encode_preset: medium # slower encode, better compression efficiency vs "fast"
  upscale_to: 1080           # Upscale output to 1080p
  enhance_face: true         # Sharpen facial details
  negative_prompt: "Aerial view, overexposed, low quality, deformation, bad hands, bad teeth, bad eyes, bad limbs, distortion, blurring"
  # Visual/audio crossfade between chunk renders when audio was split (long videos). 0 = fast concat only.
  stitch_crossfade_seconds: 0.28

storage:
  upload_dir: "./Backend/data/uploads"
  output_dir: "./Backend/data/outputs"
  temp_dir: "./Backend/data/temp"
  max_upload_size_mb: 100

logging:
  level: "INFO"
  file: "./Backend/logs/Backend.log"

database:
  uri: "mongodb+srv://[db_user]:[db_password]@cluster0.smtyx9g.mongodb.net/"
  name: "avatar_studio"

auth:
  jwt_secret: "avatar-studio-secret-change-in-production"
  token_expire_hours: 24

cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

cleanup:
  max_age_hours: 24
  interval_minutes: 30
